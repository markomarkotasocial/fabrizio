name: Build and deploy ASP.Net Core app to Azure Web App - fabrizio

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release
        working-directory: "fabrizio app/fabrizio.API"

      - name: Publish with dotnet
        run: dotnet publish -c Release -o ./publish
        working-directory: "fabrizio app/fabrizio.API"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: "fabrizio app/fabrizio.API/publish"
          retention-days: 7
  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6721FE315D35408BA5260176E7B1445D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ED93059FE2424D85859C2614AF64671E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E708085093594C46A1F6356B1F9A84AE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fabrizio'
          slot-name: 'Production'
          package: ./publish
